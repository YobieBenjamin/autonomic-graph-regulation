[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-observer"
version = "0.1.0"
description = "Layer 3 observer for the layered AI-safety architecture: scores requests for risk signals and emits signed observer assertions."
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["safety_observer*"]
